; Smart Home — firmware for the 3 ESP32 nodes
; Build one node:   pio run -e entrance        (or living / kitchen)
; Flash one node:   pio run -e entrance -t upload
; Serial monitor:   pio device monitor

[env]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
build_unflags = -std=gnu++11
build_flags = -std=gnu++17
lib_deps =
    knolleary/PubSubClient @ ^2.8

[env:entrance]
build_src_filter = +<entrance/>
lib_deps =
    ${env.lib_deps}
    miguelbalboa/MFRC522 @ ^1.4.11
    madhephaestus/ESP32Servo @ ^3.0.5

[env:living]
build_src_filter = +<living/>

[env:kitchen]
build_src_filter = +<kitchen/>
lib_deps =
    ${env.lib_deps}
    adafruit/DHT sensor library @ ^1.4.6
    adafruit/Adafruit Unified Sensor @ ^1.1.14
    madhephaestus/ESP32Servo @ ^3.0.5
